<style>
/* Layout: one workbench column. Loader strip, KPI strip, tabs, then tables that scroll inside their own box.
   Signature element: 24h machine timeline with shift bands, so idle time is visible as empty track. */
:root {
  --bg: #F1F4F7; --surface: #FFFFFF; --surface-2: #E8EDF2; --line: #D2D9E1;
  --fg: #14202B; --fg-2: #4F5F6F;
  --accent: #0A6C88; --accent-ink: #FFFFFF;
  --good: #1B7548; --good-bg: #DAF0E3;
  --warn: #8A5200; --warn-bg: #F9E7C4;
  --bad: #B0261E; --bad-bg: #FADCD8;
  --over: #5A44A6; --over-bg: #E6E0F6;
  --c-run: #4C97AF; --c-low: #E2A233; --c-high: #8068CC;
  --band-a: #F8FAFB; --band-b: #E6EBF0;
  --font-ui: 'IBM Plex Sans Thai', 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #16202A; --surface-2: #1E2B37; --line: #2B3A47;
    --fg: #E5ECF2; --fg-2: #9DAFBF;
    --accent: #55B8D4; --accent-ink: #06222B;
    --good: #5DCB91; --good-bg: #123120;
    --warn: #F0B54D; --warn-bg: #3A2B0C;
    --bad: #FF8F85; --bad-bg: #411A1A;
    --over: #BBA8F7; --over-bg: #2A2250;
    --c-run: #3C8AA4; --c-low: #D6A040; --c-high: #9A86E0;
    --band-a: #131D26; --band-b: #1A2733;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #16202A; --surface-2: #1E2B37; --line: #2B3A47;
  --fg: #E5ECF2; --fg-2: #9DAFBF;
  --accent: #55B8D4; --accent-ink: #06222B;
  --good: #5DCB91; --good-bg: #123120;
  --warn: #F0B54D; --warn-bg: #3A2B0C;
  --bad: #FF8F85; --bad-bg: #411A1A;
  --over: #BBA8F7; --over-bg: #2A2250;
  --c-run: #3C8AA4; --c-low: #D6A040; --c-high: #9A86E0;
  --band-a: #131D26; --band-b: #1A2733;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.wrap > * { min-width: 0; }
h1 { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 600; text-wrap: balance; }
h2 { font-size: 16px; margin: 26px 0 6px; font-weight: 600; }
.eyebrow { margin: 0 0 4px; font-family: var(--font-num); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.loader { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px; border: 1px dashed transparent; border-radius: 8px; }
.loader.drag { border-color: var(--accent); background: var(--surface-2); }
.hint { color: var(--fg-2); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn { display: inline-block; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 16px; border-radius: 6px; font: inherit; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#file:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
#pastebox { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
#pastebox[hidden] { display: none; }
.pbtns { display: flex; flex-wrap: wrap; gap: 8px; }
#pasteArea { width: 100%; min-height: 110px; font: 12px/1.4 var(--font-num); padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.msg:empty { display: none; }
.msg.warn { padding: 10px 14px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
.info { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--fg-2); font-size: 13px; }
.info b { color: var(--fg); font-weight: 600; }
.unp pre { margin: 6px 0 0; font: 11px/1.4 var(--font-num); white-space: pre-wrap; word-break: break-all; }
.unp summary { cursor: pointer; list-style: none; }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi > div { background: var(--surface); padding: 12px 16px; }
.k-l { font-size: 12.5px; color: var(--fg-2); }
.k-v { font: 500 24px/1.25 var(--font-num); font-variant-numeric: tabular-nums; }
.k-s { font-size: 12px; color: var(--fg-2); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-top: 6px; }
.tabs button { flex: none; border: 0; background: none; color: var(--fg-2); font: inherit; font-weight: 500; padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel > * { min-width: 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 12px; }
fieldset { margin: 0; padding: 8px 14px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: flex; flex-wrap: wrap; gap: 4px 16px; min-width: 0; }
legend { font-size: 12px; color: var(--fg-2); padding: 0 6px; }
fieldset label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }
.copybar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.note { margin: 0; color: var(--fg-2); font-size: 13px; }
.empty { margin: 0; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--fg-2); }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl thead th { background: var(--surface-2); font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.tbl tbody th { font: 500 13px var(--font-num); }
.tbl tbody tr:last-child > *, .tbl tfoot tr:last-child > * { border-bottom: 0; }
.tbl .n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.tbl .dim { color: var(--fg-2); }
.tbl .mono { font-family: var(--font-num); font-size: 12.5px; }
.tbl tfoot th, .tbl tfoot td { background: var(--surface-2); font-weight: 600; }
tr.skip > * { opacity: .45; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.low { background: var(--warn-bg); color: var(--warn); }
.chip.high { background: var(--over-bg); color: var(--over); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.shl { position: absolute; top: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--fg-2); }
.grp-grid { max-width: 780px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--fg-2); font: inherit; font-weight: 500; padding: 7px 16px; border-radius: 6px; cursor: pointer; }
.seg button:hover { color: var(--fg); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[hidden] { display: none; }
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.grp-h { padding: 12px 16px 10px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.grp-h h3 { margin: 0; font-size: 16px; font-weight: 600; }
.gm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-block: 1px solid var(--line); }
.gm > div { background: var(--surface); padding: 10px 16px; min-width: 0; }
.gm span { display: block; font-size: 12.5px; color: var(--fg-2); }
.gm b { display: block; font: 500 21px/1.3 var(--font-num); font-variant-numeric: tabular-nums; }
.grp-c { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; }
.grp .scroll { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.split { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; }
.split input { width: 80px; font: 14px var(--font-num); padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 10px 0; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label { font-size: 12.5px; color: var(--fg-2); }
input[type=number], select { font: 14px var(--font-num); padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); width: 100%; }
select { font-family: var(--font-ui); }
.tbl td.cause { white-space: normal; min-width: 340px; max-width: 560px; }
.why { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.why.mute { color: var(--fg-2); }
.why .hint { color: var(--warn); }
.k-v.warn { color: var(--warn); } .k-v.bad { color: var(--bad); } .k-v.over { color: var(--over); }
.tin { width: 6.5em; text-align: right; font: inherit; padding: 3px 6px; border: 1px solid transparent; border-bottom-color: var(--line); border-radius: 4px; background: transparent; color: inherit; }
.tin:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.tin.ed { border-color: var(--accent); background: var(--surface); font-weight: 600; }
.t8-h, .t8-r { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-bottom: 6px; }
.t8-h { font-size: 12px; color: var(--fg-2); }
.t8-b { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.t8n, .t8m, .t8v { min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: inherit; }
.t8v { text-align: right; }
.gedit { margin: 8px 0 12px; }
.gedit-h { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
.gname { flex: 1; min-width: 0; font: 500 14px var(--font-ui, inherit); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: inherit; }
.ana { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.ana > section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 0; }
.ana h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.ana ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.ana li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 13px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ana li:last-child { border-bottom: 0; padding-bottom: 0; }
.ana .m { font: 500 13px var(--font-num); }
.ana .n { font: 12.5px var(--font-num); color: var(--fg-2); }
.ana .seq { flex-basis: 100%; font: 12px var(--font-num); color: var(--fg-2); overflow-wrap: anywhere; }
.ana .imp { margin-left: auto; font: 12.5px var(--font-num); color: var(--fg-2); }
.ord { margin-top: 6px; }
.ord summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.ordta { width: 100%; margin: 8px 0 6px; font: 13px/1.5 var(--font-num); padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.fb, .sum { width: 100%; font: 13px/1.55 var(--font-ui); padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); resize: vertical; }
.fb { font-family: var(--font-num); font-size: 12px; }
@media (max-width: 520px) {
  .gm b { font-size: 18px; }
  .gm > div { padding: 8px 12px; }
  h1 { font-size: 22px; }
  .k-v { font-size: 20px; }
  .tbl th, .tbl td { padding: 6px 9px; }
}
@media (prefers-reduced-motion: no-preference) { .btn { transition: filter .15s, border-color .15s; } }

/* ---- visual pass: solder-mask hero, copper accent, pill controls, status bars ---- */
:root {
  --bg: #EBF0EC; --surface: #FFFFFF; --surface-2: #E2E9E4; --line: #CBD5CE;
  --fg: #12201B; --fg-2: #4E625A;
  --accent: #9A4F16; --accent-ink: #FFFFFF;
  --mask: #0C2A23; --mask-2: #15392F; --copper: #E39A55; --on-mask: #F2F7F4; --on-mask-2: #A9C0B6;
  --font-head: 'Prompt', 'IBM Plex Sans Thai', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1310; --surface: #111E1A; --surface-2: #19291F; --line: #264036; --fg: #E6EFEA; --fg-2: #9DB5AA;
  --accent: #E39A55; --accent-ink: #2A1606; --mask: #0E2B24; --mask-2: #173D33; } }
:root[data-theme="dark"] { --bg: #0A1310; --surface: #111E1A; --surface-2: #19291F; --line: #264036; --fg: #E6EFEA; --fg-2: #9DB5AA;
  --accent: #E39A55; --accent-ink: #2A1606; --mask: #0E2B24; --mask-2: #173D33; }
body { background: var(--bg); }
.wrap { max-width: 1040px; gap: 16px; padding-block: 14px 56px; }
.hero { position: relative; overflow: hidden; border-radius: 16px; padding: 20px 20px 18px; color: var(--on-mask); display: flex; flex-direction: column; gap: 14px;
  background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.4px) 0 0 / 16px 16px, linear-gradient(160deg, var(--mask-2), var(--mask) 62%); }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--copper), #C9792C 40%, transparent 92%); }
.hero > * { position: relative; min-width: 0; }

    var out = { rows: [] };
    String(text || '').split(/\r?\n/).forEach(function (ln) {
      var m = WROW.exec(ln); if (!m) return;
      var b = utcMin(m[11], m[10], m[9], m[12], m[13]), c = utcMin(m[11], m[10], m[9], m[14], m[15]);

    });

  }
  function parseReport(text) {
    text = String(text || '');
    var lines = text.split(/\r?\n/);
    var out = {
      rows: [], unparsed: [], machineChecks: [], shiftChecks: [], printDate: '',

    var p = {}, k;

  function pplTypeData() {
    var W = S.workers; if (!W || !W.rows.length) return null;
    var empty = !S.a || S.a.empty;
    var D = empty ? Math.floor(Math.min.apply(null, W.rows.map(function (r) { return r.b; })) / 1440) * 1440 : S.a.D;
    var rg = C.rangeFor(empty ? { hasNext: W.rows.some(function (r) { return r.b >= D + 1440; }) } : S.a, S.sheet.range);
    var typeOf = {}; Object.keys(S.woType).forEach(function (k) { typeOf[k] = S.woType[k]; }); S.parsed.rows.forEach(function (r) { typeOf[woKey(r.wo)] = r.type; });
    var cfg = typeConfig(), map = {};
    cfg.forEach(function (t) { t.codes.forEach(function (cd) { map[cd] = t.name; }); });
    var names = cfg.map(function (t) { return t.name; }), by = {}, order = [], unknown = {}, others = {}, anyOther = false;
    W.rows.forEach(function (l) {
      if (!rg.pieces.some(function (p) { return l.b >= D + p[0] * 60 && l.b < D + p[1] * 60; })) return;
      var P = by[l.no]; if (!P) { P = by[l.no] = { no: l.no, name: l.name, machines: {}, v: {}, other: 0, unk: 0, out: 0, lots: 0 }; order.push(l.no); }
      P.machines[C.shortName(l.machine)] = 1; P.out += l.out; P.lots++;
      var tp = typeOf[woKey(l.wo)];
      if (!tp) { P.unk += l.out; unknown[l.wo + ': ไม่พบเลข Lot นี้ใน csfr9041 ที่วางไว้ (' + fi(l.out) + ' ชิ้น, ' + l.no + ')'] = 1; return; }
      var g = map[String(tp).toUpperCase()];
      if (g) P.v[g] = (P.v[g] || 0) + l.out; else { P.other += l.out; anyOther = true; others[tp] = 1; }
    });
    var rows = order.map(function (no) { var P = by[no]; P.thai = peopleMap()[no] || ''; P.machText = machineText(Object.keys(P.machines)); return P; });
    var tot = { out: 0, other: 0, v: {} }; rows.forEach(function (P) { tot.out += P.out; tot.other += P.other; names.forEach(function (n) { tot.v[n] = (tot.v[n] || 0) + (P.v[n] || 0); }); });
    return { rows: rows, names: names, tot: tot, rg: rg, D: D, unknown: Object.keys(unknown), others: Object.keys(others), anyOther: anyOther };
  }

    function cell(v, k) { if (v === '' || v === null) return '<td class="n dim">-</td>'; return '<td class="n">' + (k === 'yield' ? fd(v, 2) : fi(v)) + '</td>'; }
    function row(r, cls) { return '<tr class="' + (cls || '') + '"><th scope="row">' + esc(r[0]) + '</th>' + r.slice(1).map(function (v, i) { return cell(v, t.colKeys[i]); }).join('') + '</tr>'; }
    $('res').innerHTML = '<div class="scroll"><table class="tbl"><thead><tr class="' + (o.header ? '' : 'skip') + '">' +
      t.head.map(function (h, i) { return '<th' + (i ? ' class="n"' : '') + '>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      t.body.map(function (r) { return row(r); }).join('') + '</tbody><tfoot>' + row(t.total, o.total ? 'tot' : 'tot skip') + '</tfoot></table></div>' +
      '<p class="note">แถวจางคือส่วนที่ไม่ถูกคัดลอก (ติ๊ก "รวมหัวตาราง" หรือ "รวมแถวผลรวม" ถ้าต้องการ) ตัวเลขที่คัดลอกไม่มีเครื่องหมายจุลภาค Excel จึงอ่านเป็นตัวเลข</p>';
  }

  /* ---------- events ---------- */
  function num(v, def, mn, mx) { var n = parseFloat(v); if (isNaN(n)) return def; return Math.max(mn, Math.min(mx, n)); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.grp) { S.sheet.group = Number(t.dataset.grp); renderSheetRes(); return; }
    if (t.id === 'copyType') {
      var tr = typeRows().rows;
      copyText(tr.map(function (r) { return Math.round(r.inQ); }).join('\n'), $('typeMsg'), 'คัดลอกแล้ว ' + tr.length + ' แถว (' + tr.map(function (r) { return r.name; }).join(' / ') + ')', $('fb'));
      return;
    }
    if (t.id === 'gear') { openModal(); return; }
    if (t.dataset.close !== undefined) { closeModal(); return; }
    var sheetBody = function () { refreshModal(); renderPanel(); };
    if (t.id === 'tFill') { var have = {}; S.t8.forEach(function (x) { have[C.shortName(String(x.name).trim()).toUpperCase()] = 1; }); allNames().forEach(function (n) { if (!have[n]) S.t8.push({ name: n, model: '', v: '' }); }); saveT8(); sheetBody(); return; }
    if (t.id === 'sAdd') { S.stations.push({ name: '', match: '', metric: 'out', basis: 'time' }); saveProfile(); sheetBody(); return; }
    if (t.dataset.sdel !== undefined) { S.stations.splice(Number(t.dataset.sdel), 1); saveProfile(); sheetBody(); return; }
    if (t.dataset.sumcopy) {
      var si = parseInt(t.dataset.sumcopy, 10), sb = t.dataset.sumcopy.slice(-1), RR = sumAll()[si]; if (!RR) return;
      var ids = sb === 'a' ? ['0-8', '8-16', '16-24'] : ['16-20', '20-24'];
      copyText(RR.rows.map(function (r) { return ids.map(function (k) { return Math.round(r.v[k] || 0); }).join('\t'); }).join('\n'), $('sumMsg' + si),
        'คัดลอกแล้ว ' + RR.rows.length + ' แถว (' + RR.rows.map(function (r) { return r.name; }).join(' / ') + ') × ' + ids.length + ' ช่อง', $('fb'));
      return;
    }
    if (t.id === 'tAdd') { S.t8.push({ name: '', model: '', v: '' }); saveT8(); sheetBody(); return; }
    if (t.dataset.tdel !== undefined) { S.t8.splice(Number(t.dataset.tdel), 1); saveT8(); sheetBody(); return; }
    if (t.id === 'gAdd') { S.sheet.groups.push({ name: 'กลุ่ม ' + (S.sheet.groups.length + 1), machines: '' }); saveGroups(); sheetBody(); return; }
    if (t.dataset.gdel !== undefined) { S.sheet.groups.splice(Number(t.dataset.gdel), 1); S.sheet.group = 1; saveGroups(); sheetBody(); return; }
    if (t.id === 'mkAdd') { S.masks.push({ name: '', codes: '' }); saveProfile(); sheetBody(); return; }
    if (t.dataset.mkdel !== undefined) { S.masks.splice(Number(t.dataset.mkdel), 1); saveProfile(); sheetBody(); return; }
    if (t.id === 'copyPpl') { copyText(pplTsv(), $('pplMsg'), 'คัดลอกแล้ว (เรียงตามลำดับพนักงานในตาราง)', $('fb')); return; }
    if (t.id === 'tyAdd') { S.types.push({ name: '', codes: '', v: '' }); saveTypes(); sheetBody(); return; }
    if (t.dataset.tydel !== undefined) { S.types.splice(Number(t.dataset.tydel), 1); saveTypes(); sheetBody(); return; }
    if (t.dataset.tyadd !== undefined) { S.types.push({ name: t.dataset.tyadd, codes: t.dataset.tyadd, v: '' }); saveTypes(); sheetBody(); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; renderTabs(); renderPanel(); return; }
    if (t.id === 'copyBtn') {
      var tb = C.buildCopyTable(S.a, S.copy);
      if (!tb.colKeys.length) return;
      var n = tb.rowCount;
      copyText(tb.tsv, $('copyMsg'), 'คัดลอกแล้ว ' + n + ' แถว × ' + tb.colCount + ' คอลัมน์ วางใน Excel ด้วย Ctrl+V', $('fb'));
    } else if (/^copyG\d+$/.test(t.id)) {
      var dd = sheetData(), rs = dd.rows, mel = $('sheetMsg'), where = 'แถวแรก';
      if (t.id !== 'copySheet') {
        var gi = Number(t.id.slice(5)), g = dd.groups.filter(function (x) { return x.n === gi; })[0];
        if (!g) return;
        rs = g.rows; mel = $('gMsg' + gi); where = 'แถวของ ' + g.rows[0].name;
      }
      copyText(sheetTsv(rs), mel, 'คัดลอกแล้ว ' + rs.length + ' แถว วางลงช่อง O/P : Shift ' + where + ' (Ctrl+V)', $('fb'));
    } else if (t.id === 'pasteToggle') {
      var b = $('pastebox'); b.hidden = !b.hidden; t.setAttribute('aria-expanded', String(!b.hidden)); if (!b.hidden) $('pasteArea').focus();
    } else if (t.id === 'pasteClear') {
      var pa = $('pasteArea'); pa.value = ''; pa.focus();
      var mm = $('msg'); mm.className = 'msg'; mm.textContent = '';
    } else if (t.id === 'pasteGo') {
      var v = $('pasteArea').value; if (v.trim()) { load(v, 'ข้อความที่วาง', false); }
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'file') { if (el.files && el.files.length) readFiles([].slice.call(el.files)); el.value = ''; return; }
    if (el.id === 'pplHead') { S.pplHead = el.checked; return; }
    if (el.dataset && el.dataset.ph !== undefined) { var hv = parseFloat(el.value); if (hv > 0) S.pplHours[el.dataset.ph] = hv; else delete S.pplHours[el.dataset.ph]; renderPplRes(); return; }
    if (el.name === 'rg') { S.sheet.range = el.value; renderKpi(); if (S.tab === 'ppl') renderPplRes(); else if (S.tab === 'check') renderCheckRes(); else if (S.tab === 'type') renderTypeRes(); else renderSheetRes(); return; }
    if (el.dataset && (el.dataset.smet !== undefined || el.dataset.sbas !== undefined)) {
      var sr = S.stations[Number(el.dataset.smet !== undefined ? el.dataset.smet : el.dataset.sbas)]; if (!sr) return;
      if (el.dataset.smet !== undefined) sr.metric = el.value; else sr.basis = el.value;
      saveProfile(); if (S.tab === 'sum') renderSumRes(); return;
    }
    if (el.id === 'daySel') { S.day = Number(el.value); recompute(); renderAll(); return; }
    if (el.name === 'layout') { S.copy.layout = el.value; renderCopyRes(); return; }
    if (el.dataset && el.dataset.c) { S.copy[el.dataset.c] = el.checked; renderCopyRes(); return; }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    var ck = { ckOk: ['okPct', 80, 1, 100], ckHigh: ['highPct', 100, 50, 300], ckTol: ['tol', 15, 5, 90], ckLotTol: ['lotTol', 25, 10, 200], ckGap: ['gapMin', 30, 5, 480], ckOverlap: ['overlapMin', 5, 1, 120], ckYield: ['yieldMin', 97, 80, 100], ckMinLot: ['minLot', 30, 0, 480], ckZStd: ['zStd', 170, 10, 1440], ckMkK: ['mkK', 120, 1, 10000], ckZTol: ['zTol', 0, 0, 120] }[el.id];
    var rr = function () { if (S.tab === 'ppl') renderPplRes(); else if (S.tab === 'check') renderCheckRes(); else renderSheetRes(); };
    if (ck) { S.chk[ck[0]] = num(el.value, ck[1], ck[2], ck[3]); saveChk(); rr(); return; }
    if (el.dataset && (el.dataset.ti !== undefined || el.dataset.tv !== undefined || el.dataset.tm !== undefined)) {
      var ti = Number(el.dataset.ti !== undefined ? el.dataset.ti : (el.dataset.tv !== undefined ? el.dataset.tv : el.dataset.tm)), row = S.t8[ti]; if (!row) return;
      if (el.dataset.ti !== undefined) row.name = el.value; else if (el.dataset.tm !== undefined) row.model = el.value; else row.v = el.value === '' ? '' : parseFloat(el.value);
      saveT8(); renderSheetRes(); return;
    }
    if (el.id === 'peopleTx') { S.peopleText = el.value; savePeople(); if (S.tab === 'ppl') renderPplRes(); return; }
    if (el.dataset && (el.dataset.mkn !== undefined || el.dataset.mkc !== undefined)) {
      var mr = S.masks[Number(el.dataset.mkn !== undefined ? el.dataset.mkn : el.dataset.mkc)]; if (!mr) return;
      if (el.dataset.mkn !== undefined) mr.name = el.value; else mr.codes = el.value;
      saveProfile(); if (S.tab === 'ppl') renderPplRes(); return;
    }
    if (el.dataset && (el.dataset.tyn !== undefined || el.dataset.tyv !== undefined || el.dataset.tyc !== undefined)) {
      var yi = Number(el.dataset.tyn !== undefined ? el.dataset.tyn : (el.dataset.tyv !== undefined ? el.dataset.tyv : el.dataset.tyc)), yr = S.types[yi]; if (!yr) return;
      if (el.dataset.tyn !== undefined) yr.name = el.value; else if (el.dataset.tyc !== undefined) yr.codes = el.value; else yr.v = el.value === '' ? '' : parseFloat(el.value);
      saveTypes(); if (S.tab === 'type') renderTypeRes(); return;
    }
    if (el.dataset && (el.dataset.sn !== undefined || el.dataset.sm !== undefined)) {
      var sx = S.stations[Number(el.dataset.sn !== undefined ? el.dataset.sn : el.dataset.sm)]; if (!sx) return;
      if (el.dataset.sn !== undefined) sx.name = el.value; else sx.match = el.value;
      saveProfile(); if (S.tab === 'sum') renderSumRes(); return;
    }
    if (el.dataset && el.dataset.gi !== undefined) {
      var g = S.sheet.groups[Number(el.dataset.gi)]; if (!g) return;
      if (el.classList.contains('gname')) g.name = el.value; else g.machines = el.value;
      saveGroups(); renderSheetRes(); return;
    }
  });

  // drag and drop
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); drop.classList.add('drag'); }); });
  ['dragleave', 'drop'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); drop.classList.remove('drag'); }); });
  document.addEventListener('drop', function (e) { var fl = e.dataTransfer && e.dataTransfer.files; if (fl && fl.length) readFiles([].slice.call(fl)); });

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-line]'); if (!b || b.dataset.line === S.line) return;
    saveProfile(); applyProfile(b.dataset.line, S.stn); saveProfile();
    if (S.parsed) { recompute(); renderAll(); }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-stn]'); if (!b || b.dataset.stn === S.stn) return;
    saveProfile(); applyProfile(S.line, b.dataset.stn); saveProfile();
    if (S.parsed) { recompute(); renderAll(); }
  });
  var ln0 = 'SMD1'; try { ln0 = localStorage.getItem('csfr_line') === 'SMD2' ? 'SMD2' : 'SMD1'; } catch (x) {}
  var sn0 = 'ZIN'; try { var sv = localStorage.getItem('csfr_stn'); if (STN[sv] && STN_LIST.indexOf(sv) >= 0) sn0 = sv; } catch (x) {}
  applyProfile(ln0, sn0);
  load(SAMPLE, 'ตัวอย่าง', true);
})();

</script>

</body></html>
